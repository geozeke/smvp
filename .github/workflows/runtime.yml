name: Runtime

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-title:
    name: Validate pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python -m scripts.check_commit_title "$PR_TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run mypy src

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          UV_LINK_MODE: copy
        run: uv sync --all-groups --frozen

      - name: Sync dependencies (non-Windows)
        if: runner.os != 'Windows'
        run: uv sync --all-groups --frozen

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          UV_LINK_MODE: copy
        run: uv run pytest --tb=short

      - name: Run tests (non-Windows)
        if: runner.os != 'Windows'
        run: uv run pytest --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv build
